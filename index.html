  <style>
/** Player **/
.spine-player {
	box-sizing: border-box;
	width: 100%;
	height: 100%;
	background: none;
	position: relative;
}

.spine-player * {
	box-sizing: border-box;
	font-family: "PT Sans",Arial,"Helvetica Neue",Helvetica,Tahoma,sans-serif;
	color: #dddddd;
	-webkit-touch-callout: none;
    -webkit-user-select: none;
    -khtml-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
    user-select: none;
}

.spine-player-error {
	font-size: 14px;
	display: flex;
	justify-content: center;
	position: absolute;
	top: 0;
	left: 0;
	width: 100%;
	height: 100%;
	background: black;
	z-index: 10;
	border-radius: 4px;
	overflow: auto;
}

.spine-player-hidden {
	display: none;
}

/** Slider **/
.spine-player-slider {
	width: 100%;
	height: 16px;
	position: relative;
	cursor: pointer;
}

.spine-player-slider-value {
	position: absolute;
	bottom: 0;
	height: 2px;
	background: rgba(98, 176, 238, 0.6);
	cursor: pointer;
}

.spine-player-slider:hover .spine-player-slider-value {
    height: 4px;
	background: rgba(98, 176, 238, 1);
	transition: height 0.2s;
}

.spine-player-slider-value.hovering {
    height: 4px;
	background: rgba(98, 176, 238, 1);
	transition: height 0.2s;
}

.spine-player-slider.big {
	height: 12px;
	background: rgb(0, 0, 0);
}

.spine-player-slider.big .spine-player-slider-value {
	height: 12px;
	background: rgba(98, 176, 238, 1);
}

/** Column and row layout elements **/
.spine-player-column {
	display: flex;
	flex-direction: column;
}

.spine-player-row {
	display: flex;
	flex-direction: row;
}

/** List **/
.spine-player-list {
	list-style: none !important;
	padding: 0 !important;
	margin: 0 !important;
}

.spine-player-list li {
	cursor: pointer;
	margin: 8px 8px;
}

.spine-player-list .selectable {
	display: flex;
	flex-direction: row;
	margin: 0 !important;
	padding: 2px 20px 2px 0 !important;
}

.spine-player-list li.selectable:first-child {
	margin-top: 4px !important;
}
.spine-player-list li.selectable:last-child {
	margin-bottom: 4px !important;
}

.spine-player-list li.selectable:hover {
	background: #6e6e6e;
}

.spine-player-list li.selectable .selectable-circle {
	display: flex;
	flex-direction: row;
	width: 6px;
	min-width: 6px;
	height: 6px;
	border-radius: 50%;
	background: #fff;
	align-self: center;
	opacity: 0;
	margin: 5px 10px;
}

.spine-player-list li.selectable.selected .selectable-circle {
	opacity: 1;
}

.spine-player-list li.selectable .selectable-text {
	color: #aaa;
}

.spine-player-list li.selectable.selected .selectable-text, .spine-player-list li.selectable:hover .selectable-text {
	color: #ddd;
}

/** Switch **/
.spine-player-switch {
	display: flex;
	flex-direction: row;
	margin: 2px 10px;
}

.spine-player-switch-text {
	flex: 1;
	margin-right: 8px;
}

.spine-player-switch-knob-area {
	width: 30px; /* width of the switch */
	height: 10px;
	display: block;
	border-radius: 5px; /* must be half of height */
	background: #6e6e6e;
	position: relative;
	align-self: center;
	justify-self: flex-end;
}

.spine-player-switch.active .spine-player-switch-knob-area {
	background: #5EAFF1;
}

.spine-player-switch-knob {
	display: block;
	width: 14px;
	height: 14px;
	border-radius: 50%;
	background: #9e9e9e;
	position: absolute;
	left: 0px;
	top: -2px;
	filter: drop-shadow(0 0 1px #333);
	transition: transform 0.2s;
}
.spine-player-switch.active .spine-player-switch-knob {
	background: #fff;
	transform: translateX(18px);
	transition: transform 0.2s;
}

/** Popup **/
.spine-player-popup-parent {
	position: relative;
}

.spine-player-popup {
	user-select: none;
    position: absolute;
    background: rgba(0, 0, 0, 0.75);
    z-index: 1;
	right: 2px;
    bottom: 40px;
	border-radius: 4px;
	max-height: 400%;
	overflow: auto;
	font-size: 85%;
}

.spine-player-popup-title {
    margin: 4px 15px 2px 15px;
    text-align: center;
}

.spine-player-popup hr {
	margin: 0;
	border: 0;
	border-bottom: 1px solid #cccccc70;
}

/** Canvas **/
.spine-player canvas {
	display: block;
	width: 100%;
	height: 100%;
	border-radius: 4px;
}

/** Player controls **/
.spine-player-controls {
	display: flex;
	flex-direction: column;
	position: absolute;
	bottom: 0;
	left: 0;
	width: 100%;
	opacity: 1;
	transition: opacity 0.4s;
}

.spine-player-controls-hidden {
	pointer-events: none;
	opacity: 0;
	transition: opacity 0.4s;
}

/** Player buttons **/
.spine-player-buttons {
	display: flex;
	flex-direction: row;
	width: 100%;
	background: rgba(0, 0, 0, 0.5);
	border-bottom-left-radius: 4px;
	border-bottom-right-radius: 4px;
	padding: 2px 8px 3px;
}

.spine-player-button {
	background: none;
	outline: 0;
	border: none;
	width: 32px;
	height: 32px;
	background-size: 20px;
    background-repeat: no-repeat;
    background-position: center;
	cursor: pointer;
	margin-right: 3px;
	padding-bottom: 3px;
	filter: drop-shadow(0 0 1px #333);
}

.spine-player-button-spacer {
	flex: 1;
}

.spine-player-button-icon-play {
	background-image: url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2048%2048%22%3E%3Cdefs%3E%3Cstyle%3E.cls-1%7Bfill%3A%23fff%3B%7D%3C%2Fstyle%3E%3C%2Fdefs%3E%3Ctitle%3Eplay%3C%2Ftitle%3E%3Cg%20id%3D%22play%22%3E%3Cpolygon%20class%3D%22cls-1%22%20points%3D%2243%2023.3%204%2047%204%201%2043%2023.3%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E");

  <section id="homeView" class="home-view">
    <header class="home-header">
      <div class="brand-lockup"><span class="brand-mark">境</span><div><h1>浮光造境</h1><p>角色场景模拟器</p></div></div>
    </header>
    <div class="home-intro">
      <div><h2>选择一张地图开始探索</h2><p>地图保存在当前浏览器，刷新后仍可继续使用。点击缩略图进入地图浏览界面。</p></div>
      <div class="map-count"><b id="mapCount">1</b><span>张地图</span></div>
    </div>
    <section id="mapGallery" class="map-gallery" aria-label="地图列表"></section>
  </section>

  <section id="explorerView" class="explorer-view" hidden>
    <header class="explorer-topbar">
      <button id="backHome" class="back-button">返回地图库</button>
      <div><span class="eyebrow">当前场景</span><h2 id="currentMapName">云隐山水</h2></div>
      <button id="resetScene" class="secondary-action">重置角色</button>
    </header>

    <div class="explorer-layout">
      <aside class="tool-panel map-panel">
        <div class="panel-heading"><h3>场景地图</h3><label>添加<input id="sideMapUpload" type="file" accept="image/*" multiple></label></div>
        <div id="sideMapList" class="side-map-list"></div>
        <div class="control-group">
          <div class="control-title"><span>场景缩放</span><b id="zoomValue">140%</b></div>
          <div class="zoom-control"><button id="zoomOut" type="button">-</button><input id="zoomRange" type="range" min="60" max="1000" value="140"><button id="zoomIn" type="button">+</button></div>
        </div>
        <div class="control-group">
          <div class="control-title"><span>地图显示</span><b id="fitValue">完整显示</b></div>
          <select id="mapFit">
            <option value="contain">完整显示</option>
            <option value="cover">填满画布（会裁切）</option>
          </select>
        </div>
        <div class="control-group">
          <div class="control-title"><span>手机分辨率</span><b id="resolutionLabel">720 × 1280</b></div>
          <select id="devicePreset">
            <option value="720x1280">默认竖屏 · 720 × 1280</option>
            <option value="750x1334">iPhone SE · 750 × 1334</option>
            <option value="1179x2556">iPhone 15 · 1179 × 2556</option>
            <option value="1080x2400">安卓高清 · 1080 × 2400</option>
            <option value="1536x2048">平板竖屏 · 1536 × 2048</option>
          </select>
        </div>
      </aside>

      <section class="stage-column">
        <div id="deviceFrame" class="device-frame">
          <div id="scene" class="scene">
            <div id="sceneBackground" class="scene-background">
            <div id="builtIn" class="built-in-scene"><div class="sun"></div><div class="mountain back"></div><div class="mountain front"></div><div class="ground"></div><div class="path"></div></div>
            <div id="buildingLayer" class="building-layer"></div>
            </div>
            <img id="stageCharacter" class="stage-character" src="./hero-male.png" alt="当前角色">
            <div id="spineCharacter" class="stage-character spine-character" hidden><div id="spinePlayer"></div></div>
          </div>
          <div class="scene-hud"><span id="hudMapName">云隐山水</span><b>探索中</b></div>
          <div id="joystick" class="joystick" aria-label="角色移动摇杆"><div class="joystick-ring"></div><div id="knob" class="joystick-knob"></div></div>
        </div>
        <p class="stage-help">在地图任意位置按住并拖动即可移动角色，松手停止</p>
      </section>

      <aside class="tool-panel building-panel">
        <div class="panel-heading"><h3>场景建筑</h3><label>添加<input id="buildingUpload" type="file" accept="image/*" multiple></label></div>
        <div id="buildingList" class="building-list"></div>
        <div id="buildingConfig" class="building-config" hidden>
          <label for="buildingSize">建筑宽度（像素）</label>
          <input id="buildingSize" type="number" min="20" max="3000" step="1" value="180">
          <small>高度按原图比例自动调整</small>
        </div>
        <p class="building-help">点击添加后建筑会出现在地图中央，也可以直接把图片拖到地图上的指定位置。</p>
      </aside>

      <aside class="tool-panel character-panel">
        <div class="panel-heading"><h3>角色设置</h3><label>上传<input id="characterUpload" type="file" accept="image/*" multiple></label></div>
        <div id="characterList" class="character-list"></div>
          <div class="control-group">
            <div class="control-title"><span>角色尺寸</span><b id="sizeValue">96 × 96</b></div>
            <input id="characterSize" type="range" min="48" max="260" value="96">
          </div>
          <div class="control-group">
            <div class="control-title"><span>移动速度</span><b id="speedValue">100%</b></div>
            <input id="movementSpeed" type="range" min="25" max="200" step="5" value="100">
          </div>
        <div class="coordinate-grid">
          <label>X 坐标<input id="posX" type="number" value="50" min="0" max="100"></label>
          <label>Y 坐标<input id="posY" type="number" value="68" min="0" max="100"></label>
        </div>
        <div class="tip-card"><b>移动提示</b><p>角色会沿摇杆方向持续移动，向左时自动翻转。</p></div>
      </aside>
    </div>
  </section>
</main>
<div id="dropOverlay" class="drop-overlay" aria-hidden="true"><div><b id="dropTitle">松开上传地图</b><span id="dropDescription">拖到手机地图画布内可添加为建筑</span></div></div>
<script src="./spine-player.js?v=20260730-2"></script>
<script src="./app.js?v=20260730-17"></script>
</body>
</html>
