<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
  <title>浮光造境 · 角色场景模拟器</title>
  <meta name="description" content="上传地图与角色，在手机画布中模拟移动和缩放">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
<main class="app-shell">
  <section class="workspace" id="workspace">
    <div class="left-column">
      <header class="paper-card intro-card">
        <div class="ink-heading"><h1>境</h1><span class="cloud-mark">〰</span></div>
        <div class="mist-line"></div>
        <div class="intro-row">
          <div><strong>浮光造境角色场景模拟器</strong><p>素材仅保存在本机</p></div>
          <div class="top-actions"><button class="ghost-button" id="reset">重置场景</button><button class="ghost-button" id="preview">沉浸预览</button></div>
        </div>
        <div class="panel-tabs"><button class="active" data-tab="assets">素材库</button><button data-tab="device">画布</button></div>
        <p class="section-caption">场景素材</p>
      </header>

      <section class="paper-card asset-section" id="assetsPanel">
        <div class="ink-heading small"><h2>地图</h2><span class="cloud-mark">〰</span></div>
        <div class="file-row"><label class="file-button">＋ 上传<input id="sceneUploadTop" type="file" accept="image/*" multiple></label><span>选择地图图片，素材不会上传到服务器</span></div>
        <div class="asset-grid" id="sceneList">
          <button class="asset-card empty-scene selected" data-scene="default"><span class="scene-pattern"></span><b>演示场景 · 内置山水</b><small>默认地图</small></button>
          <label class="asset-card upload-card"><span>＋</span><b>添加地图</b><small>PNG / JPG / WEBP</small><input id="sceneUpload" type="file" accept="image/*" multiple></label>
        </div>
      </section>

      <section class="paper-card character-section">
        <div class="ink-heading small"><h2>人物</h2><span class="cloud-mark">〰</span></div>
        <div class="file-row"><label class="file-button">＋ 上传<input id="characterUploadTop" type="file" accept="image/*" multiple></label><span>选择角色图或继续使用 Spine 角色</span></div>
        <div class="character-list" id="characterList"></div>
        <div id="devicePanel" hidden>
          <div class="preset-list" id="presetList"></div>
          <div class="custom-size"><button>−</button><label><input id="customWidth" type="number" value="720" aria-label="画布宽度"></label><span>×</span><label><input id="customHeight" type="number" value="1280" aria-label="画布高度"></label><button id="applySize">＋</button></div>
        </div>
      </section>

      <section class="paper-card simulator-card">
        <div class="simulator-head"><div class="ink-heading small"><h2>地图预览</h2><span class="cloud-mark">〰</span></div><span id="resolutionLabel">720 × 1280</span></div>
        <div class="device-frame" id="deviceFrame">
          <div class="scene" id="scene">
            <div class="built-in-scene" id="builtIn"><div class="sun"></div><div class="mountain back"></div><div class="mountain front"></div><div class="cloud cloud-one"></div><div class="cloud cloud-two"></div><div class="ground"></div><div class="path"></div></div>
            <img class="stage-character" id="stageCharacter" src="/hero-male.png" alt="当前角色">
          </div>
          <div class="hud"><span>云隐村</span><b>探索中</b></div>
          <div class="joystick" id="joystick" aria-label="角色移动摇杆"><div class="joystick-ring"></div><div class="joystick-knob" id="knob"></div></div>
        </div>
        <div class="map-status"><span>拖动摇杆探索场景</span><span>当前对象</span></div>
        <div class="zoom-dock"><span>近</span><input id="zoomDock" aria-label="场景远近缩放" type="range" min="60" max="180" value="100"><span>远</span><b id="zoomDockValue">100%</b></div>
      </section>
    </div>

    <aside class="paper-card right-panel">
      <div class="ink-heading"><h2>角色属性</h2><span class="cloud-mark">〰</span></div>
      <span class="live-chip">实时</span>
      <div class="character-preview"><img id="previewCharacter" src="/hero-male.png" alt=""><div><b id="characterName">剑侠 · move-right</b><small>角色图层</small></div></div>
      <div class="control-block"><div class="control-label"><span>角色尺寸</span><b id="sizeValue">135 × 135</b></div><input id="characterSize" type="range" min="48" max="260" value="135"><div class="range-labels"><span>48 px</span><span>260 px</span></div></div>
      <div class="control-block"><div class="control-label"><span>场景缩放</span><b id="zoomValue">100%</b></div><input id="zoomRange" type="range" min="60" max="180" value="100"></div>
      <div class="coordinate-grid"><label>X 坐标<input id="posX" type="number" value="50"></label><label>Y 坐标<input id="posY" type="number" value="68"></label></div>
      <div class="tips"><b>移动提示</b><p>拖动画面左下角摇杆，角色会沿任意方向持续移动。</p><p>松手即可停止。</p></div>
      <label class="big-upload">上传新角色<input id="characterUpload" type="file" accept="image/*" multiple><span>选择文件</span><small>PNG / JPG / WEBP</small></label>
    </aside>
  </section>
  <footer>所有素材仅存储在本地设备中，不会上传至服务器</footer>
</main>
<script src="/app.js"></script>
</body>
</html>
