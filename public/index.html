<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>浮光造境 · 角色场景模拟器</title><meta name="description" content="上传地图与角色，在手机画布中模拟移动和缩放"><link rel="stylesheet" href="/styles.css"></head><body>
<main class="app-shell"><header class="topbar"><div class="brand"><span class="brand-mark">境</span><div><strong>浮光造境</strong><small>角色场景模拟器</small></div></div><div class="top-actions"><span class="save-state"><i></i> 素材仅保存在本机</span><button class="ghost-button" id="reset">重置场景</button><button class="primary-button" id="preview">沉浸预览</button></div></header>
<section class="workspace" id="workspace"><aside class="left-panel"><div class="panel-tabs"><button class="active" data-tab="assets">素材库</button><button data-tab="device">画布</button></div>
<div id="assetsPanel"><div class="panel-heading"><div><small>场景素材</small><h2>地图</h2></div><label class="upload-mini">＋ 上传<input id="sceneUploadTop" type="file" accept="image/*" multiple></label></div><div class="asset-grid" id="sceneList"><button class="asset-card empty-scene selected" data-scene="default"><span class="scene-pattern"></span><b>演示场景</b><small>内置山水</small></button><label class="asset-card upload-card"><span>＋</span><b>添加地图</b><small>PNG / JPG / WEBP</small><input id="sceneUpload" type="file" accept="image/*" multiple></label></div>
<div class="panel-heading character-heading"><div><small>角色素材</small><h2>人物</h2></div><label class="upload-mini">＋ 上传<input id="characterUploadTop" type="file" accept="image/*" multiple></label></div><div class="character-list" id="characterList"></div></div>
<div id="devicePanel" hidden><div class="panel-heading"><div><small>显示设备</small><h2>手机分辨率</h2></div></div><div class="preset-list" id="presetList"></div><div class="custom-size"><label>宽度<input id="customWidth" type="number" value="720"></label><span>×</span><label>高度<input id="customHeight" type="number" value="1280"></label></div><button class="apply-size" id="applySize">应用自定义分辨率</button></div></aside>
<section class="stage-area"><div class="stage-toolbar"><div><button>−</button><span id="resolutionLabel">720 × 1280</span><button>＋</button></div><span class="stage-note">拖动摇杆探索场景</span></div><div class="device-frame" id="deviceFrame"><div class="notch"></div><div class="scene" id="scene"><div class="built-in-scene" id="builtIn"><div class="sun"></div><div class="mountain back"></div><div class="mountain front"></div><div class="cloud cloud-one"></div><div class="cloud cloud-two"></div><div class="ground"></div><div class="path"></div></div><img class="stage-character" id="stageCharacter" src="/hero-male.png" alt="当前角色"></div><div class="hud"><span>云隐村</span><b>探索中</b></div><div class="joystick" id="joystick" aria-label="角色移动摇杆"><div class="joystick-ring"></div><div class="joystick-knob" id="knob"></div></div></div><div class="zoom-dock"><span>近</span><input id="zoomDock" aria-label="场景远近缩放" type="range" min="60" max="180" value="100"><span>远</span><b id="zoomDockValue">100%</b></div></section>
<aside class="right-panel"><div class="inspector-title"><div><small>当前对象</small><h2>角色属性</h2></div><span>实时</span></div><div class="character-preview"><img id="previewCharacter" src="/hero-male.png" alt=""><div><b id="characterName">少侠</b><small>角色图层</small></div></div><div class="control-block"><div class="control-label"><span>角色尺寸</span><b id="sizeValue">135 × 135</b></div><input id="characterSize" type="range" min="48" max="260" value="135"><div class="range-labels"><span>48 px</span><span>260 px</span></div></div><div class="control-block"><div class="control-label"><span>场景缩放</span><b id="zoomValue">100%</b></div><input id="zoomRange" type="range" min="60" max="180" value="100"></div><div class="coordinate-grid"><label>X 坐标<input id="posX" type="number" value="50"></label><label>Y 坐标<input id="posY" type="number" value="68"></label></div><div class="tips"><b>移动提示</b><p>拖动画面左下角摇杆，角色会沿任意方向持续移动。松手即可停止。</p></div><label class="big-upload">上传新角色<input id="characterUpload" type="file" accept="image/*" multiple></label></aside></section></main><script src="/app.js"></script></body></html>
